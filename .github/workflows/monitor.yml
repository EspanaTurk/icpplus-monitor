name: ICPPLUS Monitor

on:
  schedule:
    # Runs every 15 minutes. GitHub may delay this slightly during high
    # load, but it's free and good enough for this purpose.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install matching ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Commit updated status
        run: |
          git config user.name "icpplus-monitor-bot"
          git config user.email "actions@github.com"
          git add data/status.json
          git diff --quiet --cached || git commit -m "Update status [skip ci]"
          git push
